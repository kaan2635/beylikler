    <script>
      // ES modülleri dosyaya çift tıklanarak (file://) açıldığında yüklenmez; oyuncuyu uyar.
      if (location.protocol === 'file:') {
        document.getElementById('view').innerHTML =
          '<div class="panel"><h2>Oyun bir sunucu üzerinden açılmalı</h2>' +
          '<p>Proje klasöründe <code>npm start</code> çalıştırıp ' +
          '<code>http://localhost:8080</code> adresini aç.</p></div>';
      } else {
        // Oyun yüklenemediyse (ör. güncelleme sırasında eski ve yeni dosyalar karıştıysa) boş sayfa bırakma.
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (window.beylikler) return;
            document.getElementById('view').innerHTML =
              '<div class="panel"><h2>Oyun yüklenemedi</h2>' +
              '<p>Oyun az önce güncellenmiş olabilir. Sayfayı <strong>Ctrl+F5</strong> ile ' +
              '(telefonda sayfayı kapatıp yeniden açarak) yenile. Kaydın güvende.</p></div>';
          }, 2000);
        });
      }
    </script>
