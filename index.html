<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beylikler</title>
    <meta name="description" content="Tarayıcıda oynanan ortaçağ strateji oyunu: köyünü büyüt, kaynak topla, beyliğini kur." />
    <meta name="theme-color" content="#35261a" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/koy">
        <img src="assets/favicon.svg" alt="" width="30" height="30" />
        <span>Beylikler</span>
      </a>
      <div id="resource-bar" class="resource-bar" aria-label="Kaynaklar"></div>
    </header>

    <nav class="tabs" aria-label="Bölümler">
      <a href="#/koy" data-route="koy">Köy</a>
      <a href="#/harita" data-route="harita">Harita</a>
      <a href="#/ordu" data-route="ordu">Ordu</a>
      <a href="#/raporlar" data-route="raporlar">Raporlar</a>
      <a href="#/ayarlar" data-route="ayarlar">Ayarlar</a>
    </nav>

    <main id="view" class="view">
      <noscript><div class="panel">Beylikler'i oynamak için JavaScript'i etkinleştir.</div></noscript>
    </main>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <footer class="footer">
      Beylikler v0.2 · Adım 3: Ordu ·
      <a href="https://github.com/kaan2635/beylikler">Kaynak kod</a>
    </footer>

    <script>
      // ES modülleri dosyaya çift tıklanarak (file://) açıldığında yüklenmez; oyuncuyu uyar.
      if (location.protocol === 'file:') {
        document.getElementById('view').innerHTML =
          '<div class="panel"><h2>Oyun bir sunucu üzerinden açılmalı</h2>' +
          '<p>Proje klasöründe <code>npm start</code> çalıştırıp ' +
          '<code>http://localhost:8080</code> adresini aç.</p></div>';
      }
    </script>
  </body>
</html>
