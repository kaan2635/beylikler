    <!-- Üst gösterge çubuğu: kaynaklar ve sekmeler birlikte sabit durur (telefonda sekmeler altta). -->
    <div class="hud">
      <header class="topbar">
        <a class="brand" href="#/koy">
          <img src="assets/favicon.svg" alt="" width="40" height="40" />
          <span>Beylikler</span>
        </a>
        <select id="village-switch" class="village-switch" aria-label="Yönetilen köy" hidden></select>
        <a id="incoming-alert" class="incoming-alert" href="#/ordu" hidden></a>
        <a id="akce-chip" class="akce-chip" href="#/hazine" title="Akçe · Hazine"></a>
        <a id="online-chip" class="online-chip" href="#/ayarlar" title="Çok oyunculu dünya" hidden></a>
        <button type="button" id="help-button" class="help-button" title="Nasıl oynanır?" aria-label="Nasıl oynanır?">?</button>
        <div id="resource-bar" class="resource-bar" aria-label="Kaynaklar"></div>
      </header>

      <nav class="tabs" aria-label="Bölümler">
        <a href="#/koy" data-route="koy">Köy</a>
        <a href="#/koyler" data-route="koyler" class="tab-extra" hidden>Köyler</a>
        <a href="#/harita" data-route="harita">Harita</a>
        <a href="#/kesif" data-route="kesif" class="tab-extra">Keşif</a>
        <a href="#/ordu" data-route="ordu">Ordu</a>
        <a href="#/raporlar" data-route="raporlar">
          Raporlar <span id="reports-badge" class="nav-badge" hidden aria-label="okunmamış rapor"></span>
        </a>
        <a href="#/gorevler" data-route="gorevler">
          Görevler <span id="quests-badge" class="nav-badge" hidden aria-label="ödülü bekleyen görev"></span>
        </a>
        <a href="#/siralama" data-route="siralama" class="tab-extra">Sıralama</a>
        <a href="#/sohbet" data-route="sohbet" class="tab-extra" hidden>Sohbet</a>
        <a href="#/ayarlar" data-route="ayarlar" class="tab-extra">Ayarlar</a>
        <!-- Telefonda ikincil sekmeler "Diğer" altında toplanır (bkz. app.js) -->
        <button type="button" id="tab-more" class="tab-more" aria-expanded="false" aria-controls="more-sheet">Diğer</button>
      </nav>
      <div id="more-sheet" class="more-sheet" hidden></div>
    </div>

    <main id="view" class="view">
      <div class="splash" aria-live="polite">
        <img src="assets/favicon.svg" alt="" width="72" height="72" />
        <p>Beylik kuruluyor…</p>
      </div>
      <noscript><div class="panel">Beylikler'i oynamak için JavaScript'i etkinleştir.</div></noscript>
    </main>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <footer class="footer">
      Beylikler v1.4 · Tek ve çok oyunculu ·
      <a href="https://github.com/kaan2635/beylikler">Kaynak kod</a> ·
      <a href="#/ayarlar">Emeği geçenler</a>
    </footer>

    <script>
      // ES modülleri dosyaya çift tıklanarak (file://) açıldığında yüklenmez; oyuncuyu uyar.
      if (location.protocol === 'file:') {
        document.getElementById('view').innerHTML =
          '<div class="panel"><h2>Oyun bir sunucu üzerinden açılmalı</h2>' +
          '<p>Proje klasöründe <code>npm start</code> çalıştırıp ' +
          '<code>http://localhost:8080</code> adresini aç.</p></div>';
      } else {
        // Oyun yüklenemediyse (ör. güncelleme sırasında eski ve yeni dosyalar karıştıysa) boş sayfa bırakma.
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (window.beylikler) return;
            document.getElementById('view').innerHTML =
              '<div class="panel"><h2>Oyun yüklenemedi</h2>' +
              '<p>Oyun az önce güncellenmiş olabilir. Sayfayı <strong>Ctrl+F5</strong> ile ' +
              '(telefonda sayfayı kapatıp yeniden açarak) yenile. Kaydın güvende.</p></div>';
          }, 2000);
        });
      }
    </script>
