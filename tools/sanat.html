<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beylikler · Görsel galerisi</title>
    <style>
      body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #eee3c9; color: #2e2316; }
      h1 { font-family: Georgia, serif; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      figure { margin: 0; padding: 8px; background: #fbf6ea; border: 1px solid #d4bf95; border-radius: 10px; text-align: center; }
      figure img { width: 100%; height: 120px; object-fit: contain; }
      figure svg { width: 64px; height: 64px; color: #2e2316; }
      figcaption { font-size: 12px; color: #6d5b42; }
      :root { --scene-sky-top: #cfe3ea; --scene-sky-bottom: #f3ead3; --scene-hill-far: #b9c7a0; --scene-hill-near: #a4b67c; --scene-ground: #b3c47c; }
      #scene svg { width: 100%; height: auto; max-height: 560px; display: block; border-radius: 12px; }
      .scene-hit { fill: transparent; }
      .scene-plate circle { fill: #2b1f14; stroke: #f0cf78; stroke-width: 1; }
      .scene-plate text { fill: #f6e7c3; font: 700 7.5px system-ui; }
      .scene-plate.empty circle { fill: #2f8f86; }
      .scene-building.empty > :not(.scene-hit) { opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>Bina görselleri</h1>
    <p>Yalnızca geliştirme için. Kaynaklar ve lisanslar: docs/EMEGI_GECENLER.md</p>
    <div id="grid" class="grid"></div>
    <h1>Simgeler</h1>
    <div id="icons" class="grid"></div>
    <h1>Köy sahnesi</h1>
    <div id="scene"></div>
    <script type="module">
      import { BUILDING_IDS } from '../js/config/buildings.js';
      import { buildingImage, gameIconSvg } from '../js/ui/art/sprites.js';
      import { GAME_ICONS } from '../js/ui/art/game-icons.js';
      import { sceneSvg } from '../js/ui/art/scene.js';

      const grid = document.getElementById('grid');
      for (const id of [...BUILDING_IDS, 'sur-ahsap']) {
        const fig = document.createElement('figure');
        const src = id === 'sur-ahsap' ? buildingImage('sur', 1) : buildingImage(id, 10);
        fig.innerHTML = `<img src="${src}" alt=""><figcaption>${id}</figcaption>`;
        grid.append(fig);
      }
      for (const key of Object.keys(GAME_ICONS)) {
        const fig = document.createElement('figure');
        fig.innerHTML = `${gameIconSvg(key)}<figcaption>${key}</figcaption>`;
        document.getElementById('icons').append(fig);
      }
      const levels = Object.fromEntries(BUILDING_IDS.map((id, i) => [id, [3, 8, 16, 1, 12, 6, 0, 5, 2, 0, 7, 4, 1, 3, 9, 6][i] ?? 1]));
      document.getElementById('scene').innerHTML = sceneSvg(levels, { upgrading: new Set(['kisla']) });
    </script>
  </body>
</html>
